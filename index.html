<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Prism 棱镜物理实验室 —— 21 个高中物理经典实验，实时图像、交互模拟与开放实验工坊。">
  <title>Prism · 棱镜物理实验室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%230a84ff'/%3E%3Cstop offset='1' stop-color='%235e5ce6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 44 32 17l14 27H18Z' fill='none' stroke='white' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M32 17v27' stroke='white' stroke-width='2.2' opacity='.65'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="ambient-orb orb-a"></span>
    <span class="ambient-orb orb-b"></span>
    <span class="ambient-orb orb-c"></span>
    <span class="noise"></span>
  </div>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand" data-route="home" role="button" tabindex="0" aria-label="返回首页">
        <span class="brand-mark">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M11 35.5 24 10l13 25.5H11Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M24 10v25.5M17 22.8h14" stroke="currentColor" stroke-width="1.5" opacity=".48"/>
          </svg>
        </span>
        <span class="brand-type"><strong>Prism</strong><em>棱镜物理实验室</em></span>
      </div>

      <div class="sidebar-scroll">
        <p class="nav-label">工作台</p>
        <nav class="nav" aria-label="主导航">
          <button class="nav-item" data-route="home">
            <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-4.8v-5.6H9.8V21H5a1 1 0 0 1-1-1v-8.8Z"/></svg></span>
            <span>概览</span>
          </button>
          <button class="nav-item" data-route="library">
            <span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></span>
            <span>实验库</span><span class="nav-badge">21</span>
          </button>
          <button class="nav-item" data-route="workshop">
            <span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a3.6 3.6 0 0 0 4.8 4.8l-8 8a2.7 2.7 0 0 1-3.8 0l-1-1a2.7 2.7 0 0 1 0-3.8l8-8Z"/><path d="m5 19 2.4-2.4M16.4 4.6l3 3"/></svg></span>
            <span>创意工坊</span><span class="nav-dot"></span>
          </button>
        </nav>

        <p class="nav-label">学科领域</p>
        <nav class="nav nav-categories" aria-label="学科分类">
          <button class="nav-item nav-cat" data-cat="mechanics">
            <span class="cat-swatch" style="--cat:#0a84ff"></span><span>力学</span><span class="nav-count">10</span>
          </button>
          <button class="nav-item nav-cat" data-cat="electricity">
            <span class="cat-swatch" style="--cat:#ff9f0a"></span><span>电磁学</span><span class="nav-count">8</span>
          </button>
          <button class="nav-item nav-cat" data-cat="optics">
            <span class="cat-swatch" style="--cat:#bf5af2"></span><span>光学</span><span class="nav-count">2</span>
          </button>
          <button class="nav-item nav-cat" data-cat="molecular">
            <span class="cat-swatch" style="--cat:#30d158"></span><span>热学与分子</span><span class="nav-count">1</span>
          </button>
        </nav>
      </div>

      <div class="sidebar-foot">
        <div class="progress-card" data-route="library" role="button" tabindex="0">
          <div class="progress-head"><span>学习进度</span><strong id="sideProgressText">0%</strong></div>
          <div class="progress-track"><i id="sideProgressBar" style="width:0%"></i></div>
          <p><span id="sideDoneCount">0</span> / 21 个实验已完成</p>
        </div>
        <div class="profile-row">
          <span class="avatar">PH</span>
          <span class="profile-copy"><strong>物理探索者</strong><em>本地学习档案</em></span>
          <button class="icon-btn tiny" id="themeBtn" title="切换外观" aria-label="切换外观">
            <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="moon" viewBox="0 0 24 24"><path d="M20.2 14.4A8.5 8.5 0 0 1 9.6 3.8 8.5 8.5 0 1 0 20.2 14.4Z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="crumb" id="crumb"><span>工作台</span><i>/</i><strong>概览</strong></div>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" id="searchBtn">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            <span>搜索实验、概念或公式</span><kbd>⌘ K</kbd>
          </button>
          <div class="font-wrap">
            <button class="icon-btn font-btn" id="fontBtn" title="字体大小" aria-label="调整字体大小" aria-expanded="false"><span>Aa</span></button>
            <div class="font-pop" id="fontPop" hidden>
              <div class="font-pop-head"><span>字体大小</span><b id="fontValue">100%</b></div>
              <div class="font-options">
                <button data-font="1" class="active"><span style="font-size:12px">A</span><em>标准</em></button>
                <button data-font="1.1"><span style="font-size:14px">A</span><em>大</em></button>
                <button data-font="1.2"><span style="font-size:16px">A</span><em>特大</em></button>
                <button data-font="1.3"><span style="font-size:19px">A</span><em>超大</em></button>
              </div>
              <p>同时放大界面文字、实验画布与图表标注</p>
            </div>
          </div>
          <button class="icon-btn" id="helpBtn" title="快速指南" aria-label="快速指南"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.4a2.3 2.3 0 0 1 4.5.7c0 1.7-2.3 2-2.3 3.5"/><path d="M12 17h.01"/></svg></button>
          <button class="lab-mode-btn" id="focusBtn" title="专注模式"><span class="mode-dot"></span><span>实验模式</span></button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot" aria-hidden="true"></div>
  <div class="palette-root" id="paletteRoot" aria-hidden="true"></div>
  <div class="mobile-scrim" id="mobileScrim"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/chart.js"></script>
  <script src="assets/js/core/expr.js"></script>
  <script src="assets/js/labs/common.js"></script>
  <script src="assets/js/labs/mechanics-a.js"></script>
  <script src="assets/js/labs/mechanics-b.js"></script>
  <script src="assets/js/labs/electricity-a.js"></script>
  <script src="assets/js/labs/electricity-b.js"></script>
  <script src="assets/js/labs/optics-molecular.js"></script>
  <script src="assets/js/workshop.js"></script>
  <script src="assets/js/plugin-api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
